<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Vault - Video Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .vault-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: 280px;
            gap: 2px;
            align-items: stretch;
            max-width: 1700px;
            margin: 0 auto;
        }
        @media(max-width: 768px) { .vault-grid { grid-template-columns: 1fr; } }

        .mondrian-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .mondrian-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .mondrian-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
            transition: transform 0.5s ease;
        }

        .mondrian-card:hover img {
            transform: scale(1.04);
            filter: brightness(0.8);
        }

        .mondrian-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.2) 70%, transparent);
            z-index: 2;
        }

        .mondrian-card-info {
            position: relative;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Top Navigation Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 0.8rem;">Hub</div></a>
        </div>

        <div class="vault-header">
            <h1 id="vaultTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Model Vault</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Select content category</p>
        </div>

        <div class="vault-grid">
            <a id="videosLink" href="#" class="mondrian-card">
                <img id="videosThumb" src="https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80" alt="Videos">
                <div class="mondrian-card-overlay"></div>
                <div class="mondrian-card-info">
                    <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Videos</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">View model streams and video tags</p>
                </div>
            </a>

            <a id="albumsLink" href="#" class="mondrian-card">
                <img id="albumsThumb" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80" alt="Albums">
                <div class="mondrian-card-overlay"></div>
                <div class="mondrian-card-info">
                    <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Albums</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Browse photo albums and image galleries</p>
                </div>
            </a>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const modelName = decodeURIComponent(params.get('name') ?? '').trim();

            if (modelName) {
                document.getElementById('vaultTitle').textContent = `${modelName} - Vault`;
                document.title = `${modelName} Vault - Portal`;
                
                document.getElementById('videosLink').href = `videotag.html?name=${encodeURIComponent(modelName)}`;
                document.getElementById('albumsLink').href = `albums.html?name=${encodeURIComponent(modelName)}`;

                const allStreams = StorageDB.getStreams();
                const modelVideos = allStreams.filter(s => !s.isPhoto && !s.folder && s.models && s.models.map(m => m.toLowerCase()).includes(modelName.toLowerCase()));
                const modelPhotos = allStreams.filter(s => s.isPhoto && s.models && s.models.map(m => m.toLowerCase()).includes(modelName.toLowerCase()));

                if (modelVideos.length > 0 && modelVideos[0].thumbnail) {
                    document.getElementById('videosThumb').src = modelVideos[0].thumbnail;
                }
                if (modelPhotos.length > 0 && (modelPhotos[0].thumbnail || modelPhotos[0].url)) {
                    document.getElementById('albumsThumb').src = modelPhotos[0].thumbnail || modelPhotos[0].url;
                }
            } else {
                document.getElementById('videosLink').href = 'index.html';
                document.getElementById('albumsLink').href = 'albums.html';
            }
        });
    </script>
</body>
</html>

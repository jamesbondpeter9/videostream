<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Vault - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .vault-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="vault-header">
            <h1 id="vaultTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Model Vault</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Integrated media and photo folders</p>
        </div>
        <div style="max-width: 1700px; margin: 0 auto; text-align: center;">
            <a href="albums.html" class="btn-primary" style="display:inline-block; padding:12px 24px; text-decoration:none;">View All Photo Albums</a>
        </div>
    </div>
    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const modelName = decodeURIComponent(params.get('name') ?? '');
            if (modelName) {
                document.getElementById('vaultTitle').textContent = `${modelName} - Vault`;
                document.title = `${modelName} Vault - Portal`;
            }
        });
    </script>
</body>
</html>

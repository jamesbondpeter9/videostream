<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Vault - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .vault-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }

        .vault-dual-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            max-width: 1700px;
            margin: 0 auto;
        }
        @media(max-width: 768px) { .vault-dual-grid { grid-template-columns: 1fr; } }

        .vault-thumb-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            height: 380px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 32px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .vault-thumb-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .vault-thumb-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.7);
            transition: transform 0.5s ease;
        }
        .vault-thumb-card:hover img {
            transform: scale(1.03);
            filter: brightness(0.85);
        }
        .vault-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.2) 60%, transparent);
            z-index: 2;
        }
        .vault-card-content {
            position: relative;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Top Navigation Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 0.8rem;">Hub</div></a>
        </div>

        <div class="vault-header">
            <h1 id="vaultTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Model Vault</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Select content type to browse</p>
        </div>

        <!-- Restored Dual-Card Mondrian Thumbnail Layout -->
        <div class="vault-dual-grid">
            <a id="videosCardBtn" href="videotag.html" class="vault-thumb-card">
                <img id="videosCoverImg" src="https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80" alt="Videos">
                <div class="vault-card-overlay"></div>
                <div class="vault-card-content">
                    <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 6px;">Collection</div>
                    <h2 style="font-size: 2rem; font-weight: 900; color: #fff; margin: 0;">🎥 Videos</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">Browse video streams tagged for this model</p>
                </div>
            </a>

            <a id="albumsCardBtn" href="albums.html" class="vault-thumb-card">
                <img id="albumsCoverImg" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80" alt="Albums">
                <div class="vault-card-overlay"></div>
                <div class="vault-card-content">
                    <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 6px;">Collection</div>
                    <h2 style="font-size: 2rem; font-weight: 900; color: #fff; margin: 0;">📁 Albums</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">View photo galleries and album folders</p>
                </div>
            </a>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const modelName = decodeURIComponent(params.get('name') ?? '').trim();

            if (modelName) {
                document.getElementById('vaultTitle').textContent = `${modelName} - Vault`;
                document.title = `${modelName} Vault - Portal`;
                
                document.getElementById('videosCardBtn').href = `videotag.html?name=${encodeURIComponent(modelName)}`;
                document.getElementById('albumsCardBtn').href = `albums.html?name=${encodeURIComponent(modelName)}`;

                // Dynamically fetch and display actual thumbnails for cover cards if available
                const allStreams = StorageDB.getStreams();
                const modelVideos = allStreams.filter(s => !s.isPhoto && !s.folder && s.models && s.models.map(m => m.toLowerCase()).includes(modelName.toLowerCase()));
                const modelPhotos = allStreams.filter(s => s.isPhoto && s.models && s.models.map(m => m.toLowerCase()).includes(modelName.toLowerCase()));

                if (modelVideos.length > 0 && modelVideos[0].thumbnail) {
                    document.getElementById('videosCoverImg').src = modelVideos[0].thumbnail;
                }
                if (modelPhotos.length > 0 && (modelPhotos[0].thumbnail || modelPhotos[0].url)) {
                    document.getElementById('albumsCoverImg').src = modelPhotos[0].thumbnail || modelPhotos[0].url;
                }
            }
        });
    </script>
</body>
</html>

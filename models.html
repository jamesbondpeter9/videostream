<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models Directory - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; justify-content: center; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.8rem; transition: all 0.2s ease; }
        .filter-btn:hover, .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
        
        .models-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 340px;
            grid-auto-flow: dense;
            gap: 2px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .models-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .models-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .models-grid { grid-template-columns: 1fr; } }

        .mondrian-card.landscape { grid-column: span 2; grid-row: span 1; }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 2; }
        .mondrian-card.square { grid-column: span 1; grid-row: span 1; }

        .update-thumb-btn { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.3); 
            color: #fff; width: 26px; height: 26px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.9rem; font-weight: bold; cursor: pointer; 
            opacity: 0; transition: opacity 0.2s ease; z-index: 20; 
        }
        .mondrian-thumb:hover .update-thumb-btn { opacity: 1; }

        .delete-btn { 
            position: absolute; top: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.3); 
            color: #ff4d4d; width: 26px; height: 26px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.9rem; font-weight: bold; cursor: pointer; 
            opacity: 0; transition: opacity 0.2s ease; z-index: 20; 
        }
        .mondrian-thumb:hover .delete-btn { opacity: 1; }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1 style="font-size: 1.5rem; font-weight: 800;">Models Directory</h1>
            <button onclick="openAddModelModal()" class="btn-primary" style="padding: 10px 18px; font-size: 0.85rem;">+ Add Model</button>
        </div>

        <div class="filter-bar" id="filterBar"></div>
        <div class="models-grid" id="modelsGrid"></div>

        <!-- Add Model Modal -->
        <div id="modelModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 400px; position:relative;">
                <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Add New Model</h3>
                <form id="modelForm">
                    <div style="margin-bottom: 14px;">
                        <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">Model Name</label>
                        <input type="text" id="modelName" required placeholder="Enter model name">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">Photo / Thumbnail URL</label>
                        <input type="text" id="modelThumb" required placeholder="https://...">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary" style="flex:1;">Save Model</button>
                        <button type="button" onclick="closeAddModelModal()" class="btn-primary" style="background:#333; color:#fff; flex:1;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Update Thumbnail Popbox Modal -->
        <div id="updateThumbModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 400px; position:relative;">
                <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Update Thumbnail Image</h3>
                <form id="updateThumbForm">
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">New Thumbnail URL</label>
                        <input type="text" id="newThumbUrl" required placeholder="https://...">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary" style="flex:1;">Update</button>
                        <button type="button" onclick="closeUpdateThumbModal()" class="btn-primary" style="background:#333; color:#fff; flex:1;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirmation Popbox Modal -->
        <div id="deleteModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 350px; text-align: center;">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 10px;">Delete Model</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Are you sure you want to remove this model from the directory?</p>
                <div style="display: flex; gap: 10px;">
                    <button onclick="confirmDeleteModel()" class="btn-primary" style="flex:1; background:#ff4d4d; color:#fff;">Delete</button>
                    <button onclick="closeDeleteModal()" class="btn-primary" style="flex:1; background:#333; color:#fff;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        let currentLetterFilter = 'ALL';
        let modelIndexToDelete = null;
        let modelIndexToUpdateThumb = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            buildFilterBar();
            renderModels();

            document.getElementById('modelForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('modelName').value.trim();
                const thumb = document.getElementById('modelThumb').value.trim();
                if (!name || !thumb) return;

                const img = new Image();
                img.src = thumb;
                img.onload = () => {
                    const shape = img.height > img.width ? 'portrait' : (img.width > img.height ? 'landscape' : 'square');
                    StorageDB.addModel(name, thumb, shape);
                    closeAddModelModal();
                    renderModels();
                };
                img.onerror = () => {
                    StorageDB.addModel(name, thumb, 'square');
                    closeAddModelModal();
                    renderModels();
                };
            });

            document.getElementById('updateThumbForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const newUrl = document.getElementById('newThumbUrl').value.trim();
                if (modelIndexToUpdateThumb !== null && newUrl) {
                    const models = StorageDB.getModels();
                    if (models[modelIndexToUpdateThumb]) {
                        const img = new Image();
                        img.src = newUrl;
                        img.onload = () => {
                            const shape = img.height > img.width ? 'portrait' : (img.width > img.height ? 'landscape' : 'square');
                            models[modelIndexToUpdateThumb].thumbnail = newUrl;
                            models[modelIndexToUpdateThumb].shape = shape;
                            StorageDB.saveModels(models);
                            renderModels();
                        };
                        img.onerror = () => {
                            models[modelIndexToUpdateThumb].thumbnail = newUrl;
                            StorageDB.saveModels(models);
                            renderModels();
                        };
                    }
                }
                closeUpdateThumbModal();
            });
        });

        function buildFilterBar() {
            const filterBar = document.getElementById('filterBar');
            const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
            filterBar.innerHTML = '';
            letters.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${letter === 'ALL' ? 'active' : ''}`;
                btn.textContent = letter;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLetterFilter = letter;
                    renderModels();
                };
                filterBar.appendChild(btn);
            });
        }

        function renderModels() {
            const models = StorageDB.getModels();
            const grid = document.getElementById('modelsGrid');
            
            const modelsWithIndex = models.map((m, idx) => ({ ...m, originalIndex: idx }));
            const filtered = modelsWithIndex.filter(m => {
                if (currentLetterFilter === 'ALL') return true;
                return m.name.toUpperCase().startsWith(currentLetterFilter);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No models found.</div>`;
                return;
            }

            grid.innerHTML = '';
            filtered.forEach((model) => {
                const card = document.createElement('div');
                const shape = model.shape || (model.originalIndex % 2 === 0 ? 'portrait' : 'landscape');
                card.className = `mondrian-card ${shape}`;

                card.innerHTML = `
                    <div class="mondrian-thumb">
                        <button type="button" class="update-thumb-btn" onclick="openUpdateThumbModal(${model.originalIndex})" title="Update thumbnail">+</button>
                        <button type="button" class="delete-btn" onclick="openDeleteModal(${model.originalIndex})" title="Delete model">&times;</button>
                        ${model.thumbnail ? `<img src="${model.thumbnail}" alt="${model.name}">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Photo</div>'}
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-weight: 700; font-size: 0.85rem; color: #fff;">${model.name}</div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function openUpdateThumbModal(index) {
            modelIndexToUpdateThumb = index;
            document.getElementById('newThumbUrl').value = '';
            document.getElementById('updateThumbModal').style.display = 'flex';
        }

        function closeUpdateThumbModal() {
            modelIndexToUpdateThumb = null;
            document.getElementById('updateThumbModal').style.display = 'none';
        }

        function openDeleteModal(index) {
            modelIndexToDelete = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            modelIndexToDelete = null;
            document.getElementById('deleteModal').style.display = 'none';
        }

        function confirmDeleteModel() {
            if (modelIndexToDelete !== null) {
                const models = StorageDB.getModels();
                models.splice(modelIndexToDelete, 1);
                StorageDB.saveModels(models);
                renderModels();
            }
            closeDeleteModal();
        }

        function openAddModelModal() { document.getElementById('modelModal').style.display = 'flex'; }
        function closeAddModelModal() { document.getElementById('modelModal').style.display = 'none'; }
    </script>
</body>
</html>

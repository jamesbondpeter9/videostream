<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Albums - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
        }

        .tag-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
        }

        .tag-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 180px;
            grid-auto-flow: dense;
            gap: 2px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .tag-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .tag-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .tag-grid { grid-template-columns: 1fr; } }

        .mondrian-card.landscape { grid-column: span 2; grid-row: span 3; }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 2; }

        .mondrian-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Top Nav Bar (Home & Models) -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background: #fff; color: #000;">Models</div></a>
        </div>

        <div class="tag-header">
            <h1 id="tagTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Model Albums</h1>
            <p id="tagSubtitle" style="color: var(--text-muted); font-size: 0.85rem;">Photo folders featuring this model</p>
        </div>

        <div class="tag-grid" id="albumGrid"></div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const modelName = decodeURIComponent(params.get('name') ?? '');

            if (modelName) {
                document.getElementById('tagTitle').textContent = `${modelName} - Albums`;
                document.title = `${modelName} Albums - Portal`;
            }

            const allStreams = StorageDB.getStreams();
            // Filter strictly for photos added via "Add New Photo" tagged with this model
            const matchedPhotos = allStreams.filter(item => item.isPhoto && item.models && item.models.includes(modelName));

            const grid = document.getElementById('albumGrid');
            if (matchedPhotos.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No photo albums found for this model.</div>`;
                return;
            }

            // Group photos by their folder name
            const folders = {};
            matchedPhotos.forEach(photo => {
                const folderName = photo.folder || photo.title.replace(/\s\(\d+\)$/, '') || 'General Album';
                if (!folders[folderName]) {
                    folders[folderName] = [];
                }
                folders[folderName].push(photo);
            });

            grid.innerHTML = '';
            const folderNames = Object.keys(folders);
            folderNames.forEach((folderName, index) => {
                const folderItems = folders[folderName];
                const coverThumb = folderItems[0].thumbnail || folderItems[0].url;

                const card = document.createElement('div');
                const patterns = ['landscape', 'portrait', 'portrait', 'landscape'];
                card.className = `mondrian-card ${patterns[index % patterns.length]}`;
                card.style.cursor = 'pointer';

                card.innerHTML = `
                    <div class="mondrian-thumb">
                        ${coverThumb ? `<img src="${coverThumb}" alt="${folderName}" style="object-fit: cover; width: 100%; height: 100%; position: absolute; inset: 0;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Cover</div>'}
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 14px; font-weight: 700; font-size: 0.85rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); z-index: 5; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);">
                            📁 ${folderName} <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">(${folderItems.length})</span>
                        </div>
                    </div>`;

                card.onclick = () => {
                    openAlbumModal(folderName, folderItems);
                };

                grid.appendChild(card);
            });
        });

        function openAlbumModal(folderName, items) {
            let modal = document.getElementById('albumModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'albumModal';
                modal.style.cssText = 'display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000; overflow-y:auto; padding:40px 20px;';
                document.body.appendChild(modal);
            }

            let itemsHtml = items.map(item => `
                <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; overflow:hidden; aspect-ratio:1/1; position:relative;">
                    <img src="${item.url}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; display:block;">
                    <a href="${item.url}" target="_blank" style="position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.7); color:#fff; padding:4px 8px; border-radius:8px; font-size:0.75rem; text-decoration:none;">View Full</a>
                </div>
            `).join('');

            modal.innerHTML = `
                <div style="max-width:1400px; margin:0 auto;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                        <h2 style="font-size:1.5rem; font-weight:800; color:#fff;">📁 ${folderName}</h2>
                        <button onclick="document.getElementById('albumModal').style.display='none'" class="btn-primary" style="padding:8px 16px;">Close</button>
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px;">
                        ${itemsHtml}
                    </div>
                </div>
            `;
            modal.style.display = 'block';
        }
    </script>
</body>
</html>

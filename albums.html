<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Albums - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .tag-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }

        .tag-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 180px;
            grid-auto-flow: dense;
            gap: 2px;
            align-items: stretch;
            max-width: 1700px;
            margin: 0 auto;
        }
        @media(max-width: 1400px) { .tag-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .tag-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .tag-grid { grid-template-columns: 1fr; } }

        .mondrian-card.landscape { grid-column: span 2; grid-row: span 3; }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 2; }

        .mondrian-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Top Navigation Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 0.8rem;">Hub</div></a>
        </div>

        <div class="tag-header">
            <h1 id="tagTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Model Albums</h1>
            <p id="tagSubtitle" style="color: var(--text-muted); font-size: 0.85rem;">Photo folders featuring this model</p>
        </div>

        <div class="tag-grid" id="albumGrid"></div>
    </div>

    <script src="storage.js"></script>
    <script src="photoviewer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const modelName = decodeURIComponent(params.get('name') ?? '').trim();

            if (modelName) {
                document.getElementById('tagTitle').textContent = `${modelName} - Albums`;
                document.title = `${modelName} Albums - Portal`;
            }

            const allStreams = StorageDB.getStreams();
            
            // STRICT FILTER: Only process items explicitly marked as photos (`isPhoto === true`). 
            // This completely ignores video streams and their manual or auto-generated thumbnails.
            const matchedPhotos = allStreams.filter(item => {
                if (item.isPhoto !== true) return false;
                if (!item.url) return false;
                if (modelName) {
                    return item.models && item.models.map(m => m.toLowerCase()).includes(modelName.toLowerCase());
                }
                return true;
            });

            const grid = document.getElementById('albumGrid');
            if (matchedPhotos.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No photo albums found for this model.</div>`;
                return;
            }

            // Group photos by folder name
            const folders = {};
            matchedPhotos.forEach(photo => {
                const folderName = photo.folder || photo.title.replace(/\s\(\d+\)$/, '') || 'General Album';
                if (!folders[folderName]) {
                    folders[folderName] = [];
                }
                folders[folderName].push(photo);
            });

            grid.innerHTML = '';
            const folderNames = Object.keys(folders);
            folderNames.forEach((folderName, index) => {
                const folderItems = folders[folderName];
                const coverThumb = folderItems[0].url || folderItems[0].thumbnail;

                const card = document.createElement('div');
                const patterns = ['landscape', 'portrait', 'portrait', 'landscape'];
                card.className = `mondrian-card ${patterns[index % patterns.length]}`;
                card.style.cursor = 'pointer';

                card.innerHTML = `
                    <div class="mondrian-thumb" style="width:100%; height:100%; position:relative;">
                        ${coverThumb ? `<img src="${coverThumb}" alt="${folderName}" style="object-fit: cover; width: 100%; height: 100%; position: absolute; inset: 0;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Cover</div>'}
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 14px; font-weight: 700; font-size: 0.85rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); z-index: 5; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);">
                            📁 ${folderName} <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">(${folderItems.length})</span>
                        </div>
                    </div>`;

                // Launch Photoviewer.js lightbox gallery
                card.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (window.PhotoViewer && typeof window.PhotoViewer.open === 'function') {
                        window.PhotoViewer.open(folderItems, 0);
                    } else {
                        window.open(folderItems[0].url, '_blank');
                    }
                };

                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>

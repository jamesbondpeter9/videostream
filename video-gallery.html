<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact" style="display: flex; gap: 8px; margin-bottom: 24px;">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box">+ Add</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background:#fff; color:#000;">Gallery Hub</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated video-gallery.html</button>
            </div>
        </div>

        <!-- EMBEDDED JSON DATABASE SOURCE OF TRUTH FOR GITHUB ACTIONS -->
        <script type="application/json" id="embedded-database">
        {
            "models": [],
            "streams": [],
            "homepage_thumbnails": []
        }
        </script>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
        });

        function downloadUpdatedGallery() {
            const payload = {
                models: StorageDB.getModels(),
                streams: StorageDB.getStreams(),
                homepage_thumbnails: []
            };
            const payloadString = JSON.stringify(payload, null, 8);

            let htmlContent = document.documentElement.outerHTML;
            const newScriptTag = `<script type="application/json" id="embedded-database">\n        ${payloadString}\n        <\/script>`;
            htmlContent = htmlContent.replace(
                /<script type="application\/json" id="embedded-database">[\s\S]*?<\/script>/,
                newScriptTag
            );

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'video-gallery.html';
            a.click();
            alert('video-gallery.html downloaded! Commit this file to your repository root to trigger automated syncing of videos.json.');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact" style="display: flex; gap: 8px; margin-bottom: 24px;">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box">+ Add</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background:#fff; color:#000;">Gallery Hub</div></a>
        </div>
        <div class="control-panel" style="max-width: 600px; margin: 0 auto; text-align: center;">
            <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 12px;">Gallery Hub</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">Export your portal database instantly to update your repository database file.</p>
            <button onclick="downloadVideosJson()" class="btn-primary" style="width: 100%;">Download Updated videos.json</button>
        </div>
    </div>
    <script src="storage.js"></script>
    <script>
        function downloadVideosJson() {
            const data = {
                models: StorageDB.getModels(),
                streams: StorageDB.getStreams(),
                homepage_thumbnails: []
            };
            const blob = new Blob([JSON.stringify(data, null, 4)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'videos.json';
            a.click();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream & Photo - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }

        .model-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .model-tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .model-tag.selected {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Tab Switcher Styles */
        .mode-tabs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            max-width: 1650px;
            margin: 0 auto 20px auto;
        }
        .mode-tab-btn {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), var(--neon-glow);
        }
        .mode-tab-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background:#fff; color:#000; font-size: 1.4rem; font-weight: 900;">+</div></a>
        </div>

        <!-- Mode Switcher Tabs -->
        <div class="mode-tabs">
            <button type="button" class="mode-tab-btn active" id="tabStreamBtn" onclick="switchMode('stream')">Add Stream</button>
            <button type="button" class="mode-tab-btn" id="tabPhotoBtn" onclick="switchMode('photo')">Add New Photo</button>
        </div>

        <!-- STREAM FORM CONTAINER -->
        <div id="streamSection" class="stream-layout-container">
            <div class="control-panel">
                <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Stream</h2>
                <form id="streamForm">
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream Title</label>
                        <input type="text" id="streamTitle" required placeholder="Enter stream title">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream URL</label>
                        <input type="text" id="streamUrl" required placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Thumbnail URL (Optional)</label>
                        <input type="text" id="streamThumbnail" placeholder="Leave blank for auto YouTube thumb">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Tag Models</label>
                        <div class="model-tags-container" id="modelTagsList">
                            <span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models in directory</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save Stream</button>
                </form>
            </div>
            <div>
                <div class="live-thumb-preview-box" id="previewContainer">
                    <span style="color: var(--text-muted);">Thumbnail Preview</span>
                </div>
            </div>
        </div>

        <!-- PHOTO FORM CONTAINER -->
        <div id="photoSection" class="stream-layout-container" style="display: none;">
            <div class="control-panel">
                <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Photo</h2>
                <form id="photoForm">

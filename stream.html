<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .model-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            padding: 4px;
            scrollbar-width: thin;
        }
        .model-tag-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .model-tag-pill:hover {
            border-color: var(--card-border-hover);
            color: #fff;
        }
        .model-tag-pill.selected {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact" style="display: flex; gap: 8px; margin-bottom: 24px;">
            <a href="index.html" class="mondrian-nav-card" style="width: 110px; text-decoration: none;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">Home</div>
            </a>
            <a href="models.html" class="mondrian-nav-card" style="width: 110px; text-decoration: none;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">Models</div>
            </a>
            <a href="stream.html" class="mondrian-nav-card" style="width: 110px; text-decoration: none;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">+ Add</div>
            </a>
        </div>

        <div class="stream-layout-container">
            <div class="control-panel">
                <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main);">Add New Stream</h2>
                <form id="streamForm">
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream Title</label>
                        <input type="text" id="streamTitle" required placeholder="Enter stream title">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream URL</label>
                        <input type="text" id="streamUrl" required placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Thumbnail URL (Optional)</label>
                        <input type="text" id="streamThumbnail" placeholder="Leave blank to auto-detect YouTube thumb">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Tag Models</label>
                        <div id="modelTagsContainer" class="model-tags-container">
                            <span style="color: var(--text-muted); font-size: 0.8rem;">No models found in directory.</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save & Export JSON</button>
                </form>
            </div>

            <div>
                <div class="live-thumb-preview-box" id="previewContainer">
                    <span style="color: var(--text-muted);">Thumbnail Preview</span>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();

            const urlInput = document.getElementById('streamUrl');
            const thumbInput = document.getElementById('streamThumbnail');
            const previewContainer = document.getElementById('previewContainer');
            const modelTagsContainer = document.getElementById('modelTagsContainer');

            // Load and render model tags from storage
            const models = StorageDB.getModels();
            const selectedModels = new Set();

            if (models.length > 0) {
                modelTagsContainer.innerHTML = '';
                models.forEach(model => {
                    const pill = document.createElement('div');
                    pill.className = 'model-tag-pill';
                    pill.textContent = model.name;
                    pill.addEventListener('click', () => {
                        if (selectedModels.has(model.name)) {
                            selectedModels.delete(model.name);
                            pill.classList.remove('selected');
                        } else {
                            selectedModels.add(model.name);
                            pill.classList.add('selected');
                        }
                    });
                    modelTagsContainer.appendChild(pill);
                });
            }

            function updatePreview() {
                let url = urlInput.value.trim();
                let thumb = thumbInput.value.trim();

                if (!thumb && url) {
                    if (url.includes('youtube.com') || url.includes('youtu.be')) {
                        let ytId = '';
                        if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                        else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                        else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                        if (ytId) thumb = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                    }
                }

                if (thumb) {
                    const img = new Image();
                    img.src = thumb;
                    img.onload = () => {
                        if (img.naturalHeight > img.naturalWidth) {
                            previewContainer.className = 'live-thumb-preview-box portrait-mode';
                        } else {
                            previewContainer.className = 'live-thumb-preview-box';
                        }
                    };
                    previewContainer.innerHTML = `<img src="${thumb}" alt="Preview"><div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); font-weight: 700; font-size: 0.85rem; color: #fff;">Live Preview</div>`;
                } else {
                    previewContainer.className = 'live-thumb-preview-box';
                    previewContainer.innerHTML = `<span style="color: var(--text-muted);">Thumbnail Preview</span>`;
                }
            }

            urlInput.addEventListener('input', updatePreview);
            thumbInput.addEventListener('input', updatePreview);

            document.getElementById('streamForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('streamTitle').value.trim();
                const url = document.getElementById('streamUrl').value.trim();
                let thumbnail = document.getElementById('streamThumbnail').value.trim();

                if (!thumbnail && url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    if (ytId) thumbnail = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                }

                if (!title || !url) return;

                StorageDB.addStream({
                    title,
                    url,
                    thumbnail: thumbnail || '',
                    models: Array.from(selectedModels)
                });

                alert('Stream saved with tagged models! videos.json has been downloaded.');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>

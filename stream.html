<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact" style="display: flex; gap: 8px; margin-bottom: 24px;">
            <a href="index.html" class="mondrian-nav-card" style="width: 110px;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px;">Home</div>
            </a>
            <a href="models.html" class="mondrian-nav-card" style="width: 110px;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px;">Models</div>
            </a>
            <a href="stream.html" class="mondrian-nav-card" style="width: 110px;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px;">+ Add</div>
            </a>
        </div>

        <div class="stream-layout-container">
            <div class="control-panel">
                <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main);">Add New Stream</h2>
                <form id="streamForm">
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream Title</label>
                        <input type="text" id="streamTitle" required placeholder="Enter stream title">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream URL</label>
                        <input type="text" id="streamUrl" required placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Thumbnail URL (Optional)</label>
                        <input type="text" id="streamThumbnail" placeholder="Leave blank to auto-detect YouTube thumb">
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save & Export JSON</button>
                </form>
            </div>

            <div>
                <div class="live-thumb-preview-box" id="previewContainer">
                    <span style="color: var(--text-muted);">Thumbnail Preview</span>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();

            const urlInput = document.getElementById('streamUrl');
            const thumbInput = document.getElementById('streamThumbnail');
            const previewContainer = document.getElementById('previewContainer');

            function updatePreview() {
                let url = urlInput.value.trim();
                let thumb = thumbInput.value.trim();

                if (!thumb && url) {
                    if (url.includes('youtube.com') || url.includes('youtu.be')) {
                        let ytId = '';
                        if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                        else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                        else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                        if (ytId) thumb = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                    }
                }

                if (thumb) {
                    const img = new Image();
                    img.src = thumb;
                    img.onload = () => {
                        if (img.naturalHeight > img.naturalWidth) {
                            previewContainer.className = 'live-thumb-preview-box portrait-mode';
                        } else {
                            previewContainer.className = 'live-thumb-preview-box';
                        }
                    };
                    previewContainer.innerHTML = `<img src="${thumb}" alt="Preview"><div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); font-weight: 700; font-size: 0.85rem; color: #fff;">Live Preview</div>`;
                } else {
                    previewContainer.className = 'live-thumb-preview-box';
                    previewContainer.innerHTML = `<span style="color: var(--text-muted);">Thumbnail Preview</span>`;
                }
            }

            urlInput.addEventListener('input', updatePreview);
            thumbInput.addEventListener('input', updatePreview);

            document.getElementById('streamForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('streamTitle').value.trim();
                const url = document.getElementById('streamUrl').value.trim();
                let thumbnail = document.getElementById('streamThumbnail').value.trim();

                if (!thumbnail && url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    if (ytId) thumbnail = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                }

                if (!title || !url) return;

                StorageDB.addStream({
                    title,
                    url,
                    thumbnail: thumbnail || '',
                    models: []
                });

                alert('Stream saved successfully! videos.json has been downloaded.');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .model-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            padding: 4px;
        }
        .model-tag-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .model-tag-pill.selected {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact" style="display: flex; gap: 8px; margin-bottom: 24px;">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background:#fff; color:#000;">+ Add</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Gallery Hub</div></a>
        </div>

        <div class="stream-layout-container">
            <div class="control-panel">
                <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Stream</h2>
                <form id="streamForm">
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream Title</label>
                        <input type="text" id="streamTitle" required placeholder="Enter stream title">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream URL</label>
                        <input type="text" id="streamUrl" required placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Thumbnail URL (Optional)</label>
                        <input type="text" id="streamThumbnail" placeholder="Leave blank to auto-detect YouTube thumb">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Tag Models</label>
                        <div id="modelTagsContainer" class="model-tags-container">
                            <span style="color: var(--text-muted); font-size: 0.8rem;">No models found in directory.</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save Stream</button>
                </form>
            </div>
            <div>
                <div class="live-thumb-preview-box" id="previewContainer">
                    <span style="color: var(--text-muted);">Thumbnail Preview</span>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const urlInput = document.getElementById('streamUrl');
            const thumbInput = document.getElementById('streamThumbnail');
            const previewContainer = document.getElementById('previewContainer');
            const modelTagsContainer = document.getElementById('modelTagsContainer');

            const models = StorageDB.getModels();
            const selectedModels = new Set();

            if (models.length > 0) {
                modelTagsContainer.innerHTML = '';
                models.forEach(model => {
                    const pill = document.createElement('div');
                    pill.className = 'model-tag-pill';
                    pill.textContent = model.name;
                    pill.addEventListener('click', () => {
                        if (selectedModels.has(model.name)) {
                            selectedModels.delete(model.name);
                            pill.classList.remove('selected');
                        } else {
                            selectedModels.add(model.name);
                            pill.classList.add('selected');
                        }
                    });
                    modelTagsContainer.appendChild(pill);
                });
            }

            urlInput.addEventListener('input', () => {
                let url = urlInput.value.trim();
                let thumb = thumbInput.value.trim();
                if (!thumb && url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    if (ytId) thumb = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                }
                if (thumb) {
                    previewContainer.innerHTML = `<img src="${thumb}" alt="Preview" style="width:100%;height:100%;object-fit:cover;border-radius:20px;">`;
                }
            });

            document.getElementById('streamForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('streamTitle').value.trim();
                const url = document.getElementById('streamUrl').value.trim();
                let thumbnail = document.getElementById('streamThumbnail').value.trim();

                if (!thumbnail && url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    if (ytId) thumbnail = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                }

                if (!title || !url) return;

                StorageDB.addStream({
                    title,
                    url,
                    thumbnail: thumbnail || '',
                    models: Array.from(selectedModels)
                });

                alert('Stream saved successfully!');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>

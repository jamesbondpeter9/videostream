<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Content - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .model-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .model-tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .model-tag.selected {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .content-stack-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 1650px;
            margin: 0 auto;
        }
        .stream-layout-container {
            margin: 0 !important;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Restored Top Navigation Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background:#fff; color:#000; font-size: 1.4rem; font-weight: 900;">+</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 0.8rem;">Hub</div></a>
        </div>

        <div class="content-stack-wrapper">
            <!-- STREAM FORM CONTAINER -->
            <div id="streamSection" class="stream-layout-container">
                <div class="control-panel">
                    <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Stream</h2>
                    <form id="streamForm">
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream Title</label>
                            <input type="text" id="streamTitle" required placeholder="Enter stream title">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream URL</label>
                            <input type="text" id="streamUrl" required placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Thumbnail URL (Optional)</label>
                            <input type="text" id="streamThumbnail" placeholder="Leave blank for auto YouTube thumb">
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Tag Models</label>
                            <div class="model-tags-container" id="modelTagsList">
                                <span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models in directory</span>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">Save Stream</button>
                    </form>
                </div>
                <div>
                    <div class="live-thumb-preview-box" id="previewContainer">
                        <span style="color: var(--text-muted);">Thumbnail Preview</span>
                    </div>
                </div>
            </div>

            <!-- PHOTO FORM CONTAINER -->
            <div id="photoSection" class="stream-layout-container">
                <div class="control-panel">
                    <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Photo</h2>
                    <form id="photoForm">
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Photo Title / Folder Name</label>
                            <input type="text" id="photoTitle" required placeholder="Enter photo title or folder name">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Batch Direct Links / HTML / BBCodes Input</label>
                            <textarea id="photoRawInput" required rows="4" placeholder="Paste multiple direct URLs, HTML tags, or BBCodes (one per line or separated)..." style="width: 100%; background: rgba(0, 0, 0, 0.75); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 16px; color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; outline: none; resize: vertical;"></textarea>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Tag Models</label>
                            <div class="model-tags-container" id="photoModelTagsList">
                                <span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models in directory</span>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">Save Photos & Auto-Create Folder</button>
                    </form>
                </div>
                <div>
                    <div class="live-thumb-preview-box" id="photoPreviewContainer">
                        <span style="color: var(--text-muted);">Thumbnail Preview</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        let selectedModels = [];
        let selectedPhotoModels = [];

        function parseAllImageInputs(textInput) {
            if (!textInput) return [];
            const results = [];
            const chunks = textInput.split(/\r?\n|,/);
            
            chunks.forEach(chunk => {
                let val = chunk.trim();
                if (!val) return;

                const htmlImgMatch = val.match(/<img[^>]+src=["']([^"']+)["']/i);
                if (htmlImgMatch && htmlImgMatch[1]) {
                    results.push(htmlImgMatch[1].trim());
                    return;
                }

                const htmlHrefMatch = val.match(/<a[^>]+href=["']([^"']+\.(?:png|jpg|jpeg|webp|gif|bmp)(?:\?[^"']*)?)["']/i);
                if (htmlHrefMatch && htmlHrefMatch[1]) {
                    results.push(htmlHrefMatch[1].trim());
                    return;
                }

                const bbcodeImgMatch = val.match(/[img]([^\[]+)\[\/img\]/i);
                if (bbcodeImgMatch && bbcodeImgMatch[1]) {
                    results.push(bbcodeImgMatch[1].trim());
                    return;
                }

                const quotedUrlMatch = val.match(/(?:src|href)=["'](https?:\/\/[^"']+)["']/i);
                if (quotedUrlMatch && quotedUrlMatch[1]) {
                    results.push(quotedUrlMatch[1].trim());
                    return;
                }

                const rawUrlMatch = val.match(/https?:\/\/[^\s"'<>]+/i);
                if (rawUrlMatch) {
                    results.push(rawUrlMatch[0].trim());
                }
            });

            return results;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            renderModelTags();

            const urlInput = document.getElementById('streamUrl');
            const thumbInput = document.getElementById('streamThumbnail');
            const previewContainer = document.getElementById('previewContainer');

            function updateThumbPreview() {
                let url = urlInput.value.trim();
                let thumb = thumbInput.value.trim();
                
                if (!thumb && url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    if (ytId) thumb = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                }

                if (thumb) {
                    previewContainer.innerHTML = `<img src="${thumb}" alt="Preview" style="width:100%;height:100%;object-fit:contain;border-radius:20px;background:#000;">`;
                } else {
                    previewContainer.innerHTML = `<span style="color: var(--text-muted);">Thumbnail Preview</span>`;
                }
            }

            urlInput.addEventListener('input', updateThumbPreview);
            thumbInput.addEventListener('input', updateThumbPreview);

            const photoRawInput = document.getElementById('photoRawInput');
            const photoPreviewContainer = document.getElementById('photoPreviewContainer');

            photoRawInput.addEventListener('input', () => {
                const parsedUrls = parseAllImageInputs(photoRawInput.value);
                if (parsedUrls.length > 0) {
                    photoPreviewContainer.innerHTML = `<img src="${parsedUrls[0]}" alt="Preview" style="width:100%;height:100%;object-fit:contain;border-radius:20px;background:#000;">`;
                } else {
                    photoPreviewContainer.innerHTML = `<span style="color: var(--text-muted);">Thumbnail Preview</span>`;
                }
            });

            document.getElementById('streamForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const title = document.getElementById('streamTitle').value.trim();
                const url = document.getElementById('streamUrl').value.trim();
                let thumbnail = document.getElementById('streamThumbnail').value.trim();

                if (!thumbnail && url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    if (ytId) thumbnail = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                }

                if (!title || !url) return;
                
                StorageDB.addStream({
                    title,
                    url,
                    thumbnail: thumbnail || '',
                    models: selectedModels,
                    isPhoto: false
                });

                window.location.href = 'index.html';
            });

            document.getElementById('photoForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const folderName = document.getElementById('photoTitle').value.trim();
                const rawVal = document.getElementById('photoRawInput').value.trim();
                const imageUrls = parseAllImageInputs(rawVal);

                if (!folderName || imageUrls.length === 0) return;

                imageUrls.forEach((imageUrl, idx) => {
                    const photoTitle = imageUrls.length > 1 ? `${folderName} (${idx + 1})` : folderName;
                    StorageDB.addStream({
                        title: photoTitle,
                        url: imageUrl,
                        thumbnail: imageUrl,
                        models: selectedPhotoModels,
                        isPhoto: true,
                        folder: folderName
                    });
                });

                window.location.href = `albums.html${selectedPhotoModels.length > 0 ? '?name=' + encodeURIComponent(selectedPhotoModels[0]) : ''}`;
            });
        });

        function renderModelTags() {
            const models = StorageDB.getModels();
            const container = document.getElementById('modelTagsList');
            const photoContainer = document.getElementById('photoModelTagsList');

            if (models.length === 0) {
                container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models in directory</span>`;
                photoContainer.innerHTML = `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models in directory</span>`;
                return;
            }

            container.innerHTML = '';
            models.forEach(model => {
                const tag = document.createElement('div');
                tag.className = `model-tag ${selectedModels.includes(model.name) ? 'selected' : ''}`;
                tag.textContent = model.name;
                tag.onclick = () => {
                    if (selectedModels.includes(model.name)) {
                        selectedModels = selectedModels.filter(m => m !== model.name);
                    } else {
                        selectedModels.push(model.name);
                    }
                    renderModelTags();
                };
                container.appendChild(tag);
            });

            photoContainer.innerHTML = '';
            models.forEach(model => {
                const tag = document.createElement('div');
                tag.className = `model-tag ${selectedPhotoModels.includes(model.name) ? 'selected' : ''}`;
                tag.textContent = model.name;
                tag.onclick = () => {
                    if (selectedPhotoModels.includes(model.name)) {
                        selectedPhotoModels = selectedPhotoModels.filter(m => m !== model.name);
                    } else {
                        selectedPhotoModels.push(model.name);
                    }
                    renderModelTags();
                };
                photoContainer.appendChild(tag);
            });
        }
    </script>
</body>
</html>

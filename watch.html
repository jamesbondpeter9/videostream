<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .watch-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }
        .delete-stream-btn {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .delete-stream-btn:hover {
            background: rgba(255, 50, 50, 0.9);
            color: #ffffff;
            border-color: #ff3232;
        }
        .player-wrapper {
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="site-container" style="max-width: 1400px;">
        <div class="watch-top-bar">
            <a href="index.html" class="mondrian-nav-card" style="width: 110px; text-decoration: none;">
                <div class="mondrian-nav-box" style="aspect-ratio: 2.8 / 1; max-height: 42px; font-size: 0.75rem; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">← Home</div>
            </a>
            <h1 id="streamTitleHeading" style="font-size: 1.3rem; font-weight: 800; color: #fff; margin: 0; flex: 1; text-align: center; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Loading Stream...</h1>
            <button id="deleteStreamBtn" class="delete-stream-btn" style="display: none;">Delete Stream</button>
        </div>

        <div class="player-wrapper" id="playerContainer"></div>
    </div>

    <script src="storage.js"></script>
    <script src="player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();

            const urlParams = new URLSearchParams(window.location.search);
            const streamIndex = urlParams.get('index');

            const streams = StorageDB.getStreams();
            const stream = streams[streamIndex];

            if (!stream) {
                document.getElementById('streamTitleHeading').textContent = 'Stream Not Found';
                document.getElementById('playerContainer').innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">The requested stream could not be loaded.</div>`;
                return;
            }

            document.getElementById('streamTitleHeading').textContent = stream.title;

            const deleteBtn = document.getElementById('deleteStreamBtn');
            deleteBtn.style.display = 'block';
            deleteBtn.addEventListener('click', () => {
                if (confirm(`Are you sure you want to delete "${stream.title}"?`)) {
                    StorageDB.removeStream(streamIndex);
                    window.location.href = 'index.html';
                }
            });

            VideoPlayer.init('playerContainer', stream);
        });
    </script>
</body>
</html>

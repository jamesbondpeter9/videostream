<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .watch-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.95), var(--neon-glow);
            margin-bottom: 20px;
        }

        .player-wrapper iframe, .player-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .stream-info-panel {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Top Nav Bar matching your portal style -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
        </div>

        <div class="watch-container">
            <div class="player-wrapper" id="playerContainer">
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">Loading player...</div>
            </div>
            <div class="stream-info-panel">
                <h1 id="streamTitle" style="font-size: 1.4rem; font-weight: 800; margin-bottom: 14px;">Loading stream...</h1>
                <div id="modelTags" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const index = parseInt(params.get('index') ?? '0', 10);
            const streams = StorageDB.getStreams();
            
            const stream = streams[index];
            if (!stream) {
                document.getElementById('playerContainer').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">Stream not found.</div>`;
                document.getElementById('streamTitle').textContent = 'Stream Not Found';
                return;
            }

            document.title = `${stream.title} - Video Portal`;
            document.getElementById('streamTitle').textContent = stream.title;

            // Render Tagged Models
            const tagsContainer = document.getElementById('modelTags');
            if (stream.models && stream.models.length > 0) {
                stream.models.forEach(modelName => {
                    const tag = document.createElement('span');
                    tag.style.cssText = 'background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;';
                    tag.textContent = modelName;
                    tagsContainer.appendChild(tag);
                });
            } else {
                tagsContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem;">No models tagged</span>';
            }

            // Setup Player Embed
            const playerContainer = document.getElementById('playerContainer');
            let embedHtml = '';
            const url = stream.url;

            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let ytId = '';
                if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                
                if (ytId) {
                    embedHtml = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                }
            } else if (url.match(/\.(mp4|webm|ogg)$/i)) {
                embedHtml = `<video src="${url}" controls autoplay style="width:100%;height:100%;"></video>`;
            } else {
                embedHtml = `<iframe src="${url}" allowfullscreen></iframe>`;
            }

            playerContainer.innerHTML = embedHtml;
        });
    </script>
</body>
</html>

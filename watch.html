<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .watch-container {
            max-width: 1700px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-wrapper iframe,
        .player-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .stream-info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .model-badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .model-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .model-badge:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Top Navigation Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 0.8rem;">Hub</div></a>
        </div>

        <div class="watch-container">
            <div class="player-wrapper" id="playerContainer">
                <span style="color: var(--text-muted);">Loading stream...</span>
            </div>

            <div class="stream-info-header">
                <div>
                    <h1 id="streamTitle" style="font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 6px;">Loading Title...</h1>
                    <div id="modelBadgesContainer" class="model-badge-list"></div>
                </div>
                <div>
                    <button id="deleteBtn" class="btn-primary" style="background: rgba(255, 50, 50, 0.2); border-color: rgba(255, 50, 50, 0.4); color: #ff6b6b; padding: 10px 20px;">Delete Stream</button>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const index = parseInt(params.get('index'), 10);

            const streams = StorageDB.getStreams();
            if (isNaN(index) || !streams[index]) {
                document.getElementById('playerContainer শক্তির').innerHTML = `<span style="color: #ff6b6b;">Stream not found or invalid index.</span>`;
                document.getElementById('streamTitle').textContent = 'Stream Unavailable';
                return;
            }

            const stream = streams[index];
            document.getElementById('streamTitle').textContent = stream.title;
            document.title = `${stream.title} - Watch`;

            // Render Player (Supports YouTube embed conversion or direct video/stream links)
            const playerContainer = document.getElementById('playerContainer');
            let embedUrl = stream.url;

            if (embedUrl.includes('youtube.com/watch?v=')) {
                const ytId = embedUrl.split('watch?v=')[1].split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                playerContainer.innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else if (embedUrl.includes('youtu.be/')) {
                const ytId = embedUrl.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                playerContainer.innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else if (embedUrl.endsWith('.mp4') || embedUrl.endsWith('.webm') || embedUrl.endsWith('.ogg')) {
                playerContainer.innerHTML = `<video src="${embedUrl}" controls autoplay style="width:100%;height:100%;"></video>`;
            } else {
                playerContainer.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            }

            // Render Tagged Models
            const badgeContainer = document.getElementById('modelBadgesContainer');
            if (stream.models && stream.models.length > 0) {
                badgeContainer.innerHTML = stream.models.map(model => 
                    `<a href="vault.html?name=${encodeURIComponent(model)}" class="model-badge">👤 ${model}</a>`
                ).join('');
            } else {
                badgeContainer.innerHTML = `<span style="color: var(--text-muted); font-size: 0.75rem;">No models tagged</span>`;
            }

            // Delete Stream Handler
            document.getElementById('deleteBtn').onclick = () => {
                if (confirm(`Are you sure you want to delete "${stream.title}"?`)) {
                    StorageDB.deleteStream(index);
                    alert('Stream deleted successfully.');
                    window.location.href = 'index.html';
                }
            };
        });
    </script>
</body>
</html>

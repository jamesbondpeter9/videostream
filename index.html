<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Compact Navigation Header Sizing */
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
        }

        /* Mosaic Grid configured for 180px base row height */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 180px;
            grid-auto-flow: dense;
            gap: 2px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .home-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .home-grid { grid-template-columns: 1fr; } }

        /* Landscape: span 2 columns wide x 3 rows high */
        .mondrian-card.landscape { 
            grid-column: span 2; 
            grid-row: span 3; 
        }

        /* Portrait: span 1 column wide x 2 rows high */
        .mondrian-card.portrait { 
            grid-column: span 1; 
            grid-row: span 2; 
        }

        .mondrian-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Compact Top Nav Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background: #fff; color: #000;">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.3rem; font-weight: 900;">+</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.2rem; font-weight: 900;" title="Gallery Hub Sync">↓</div></a>
        </div>
        
        <div class="home-grid" id="streamsGrid"></div>
    </div>
    
    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const streams = StorageDB.getStreams();
            const grid = document.getElementById('streamsGrid');
            if (streams.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No streams found. Click "+" to create your first stream!</div>`;
                return;
            }
            grid.innerHTML = '';
            streams.forEach((stream, index) => {
                const card = document.createElement('a');
                card.href = `watch.html?index=${index}`;
                
                // Alternating pattern between landscape and portrait sizes
                const patterns = ['landscape', 'portrait', 'portrait', 'landscape'];
                card.className = `mondrian-card ${patterns[index % patterns.length]}`;

                card.innerHTML = `
                    <div class="mondrian-thumb">
                        ${stream.thumbnail ? `<img src="${stream.thumbnail}" alt="${stream.title}" style="object-fit: cover; width: 100%; height: 100%; position: absolute; inset: 0;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Thumbnail</div>'}
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 14px; font-weight: 700; font-size: 0.8rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); z-index: 5;">${stream.title}</div>
                    </div>`;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>

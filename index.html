<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Portal</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="models.html">Models</a>
                <a href="stream.html">Streams</a>
            </nav>
        </header>

        <main>
            <section class="list-section">
                <h2>Featured Streams</h2>
                <div id="homeStreamsContainer" class="mondrian-grid">
                    <!-- Populated dynamically -->
                </div>
            </section>
        </main>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const container = document.getElementById('homeStreamsContainer');
            const streams = StorageDB.getStreams();

            if (streams.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No streams available yet. Add some via <a href="stream.html" style="color: var(--accent-gold);">Streams</a>.</p>';
                return;
            }

            container.innerHTML = streams.map((stream, index) => `
                <a href="watch.html?index=${index}" class="mondrian-card">
                    <div class="mondrian-thumb">
                        <img src="${stream.thumbnail || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe'}" alt="${stream.title}">
                    </div>
                    <div class="card-body">
                        <h3>${stream.title}</h3>
                        <small style="color: var(--text-muted);">Models: ${stream.models && stream.models.length > 0 ? stream.models.join(', ') : 'None'}</small>
                    </div>
                </a>
            `).join('');
        });
    </script>
</body>
</html>
